name: release

# This workflow is the sole publisher. `relkit release` pushes the tag and then
# verifies what this run published; it never creates a release, uploads an asset or
# reruns CI. Keep the uploaded set and `release.assets` in relkit.toml identical:
# the coordinator compares the published set against GitHub's signed release
# attestation only after the immutable release exists.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: python tools/check.py

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the synchronized release set
        run: python tools/build_release.py dist
        env:
          PYTHONPATH: src
      - name: Read the committed changelog entry
        run: python -m releasekit.cli notes "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/notes.md"
        env:
          PYTHONPATH: src
      - name: Attest every published asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/relkit.pyz
            dist/relkit.pyz.sha256
            dist/release-kit-plugin.zip
            dist/release-kit-plugin.zip.sha256
            dist/release.json
      - name: Attach the exact asset set to a draft
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          dist/relkit.pyz dist/relkit.pyz.sha256
          dist/release-kit-plugin.zip dist/release-kit-plugin.zip.sha256 dist/release.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish it, which makes the release immutable
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
