name: release

# This workflow is the sole publisher. `relkit release` pushes the tag and then
# verifies what this run published; it never creates a release, uploads an asset or
# reruns CI. Keep the uploaded set and `release.assets` in relkit.toml identical:
# the coordinator compares the published set against GitHub's signed release
# attestation only after the immutable release exists.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Every platform reports. Cancelling the others on the first failure is how a
      # second, unrelated platform failure stays hidden for another release.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: python tools/check.py

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the synchronized release set
        run: python tools/build_release.py dist
        env:
          PYTHONPATH: src
      - name: Read the committed changelog entry
        run: python -m releasekit.cli notes "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/notes.md"
        env:
          PYTHONPATH: src
      # No build-provenance step: GitHub refuses to persist attestations for a
      # user-owned private repository, and relkit.toml declares
      # require_provenance = false to match. Restoring it means three edits at once,
      # never one without the others: the attest step here, `id-token: write` and
      # `attestations: write` above, and that key in relkit.toml.
      - name: Attach the exact asset set to a draft
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          dist/relkit.pyz dist/relkit.pyz.sha256
          dist/release-kit-plugin.zip dist/release-kit-plugin.zip.sha256 dist/release.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish it, which makes the release immutable
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
