name: release

# Explicit supplementary checks only; this workflow never publishes a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to prepare (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt uv
      # Check packages once, on the candidate below, not a throwaway build per OS.
      - run: python tools/check_distribution.py --source-only

  candidate:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the synchronized release set
        run: python tools/build_release.py dist
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist
          if-no-files-found: error
          retention-days: 14

  candidate-smoke:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist
      - run: python -m pip install --disable-pip-version-check uv
      - name: Check these downloaded bytes without rebuilding
        run: python tools/check_distribution.py --assets dist --version "${VERSION#v}"
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
