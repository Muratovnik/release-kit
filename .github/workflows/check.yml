name: check

# Optional hosted matrix. The same complete gate can run locally without Actions.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt uv
      - run: python tools/check_distribution.py
