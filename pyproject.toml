[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "release-kit"
version = "0.2.0"
description = "Release-cycle and publication-exposure gates for any repository"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# No Python runtime dependencies. Betterleaks and Lychee are verified, pinned binary
# engines provisioned by release-kit itself rather than duplicated by every adopter.
dependencies = []

[project.scripts]
relkit = "releasekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
cache-dir = ".cache/ruff"

[tool.pytest.ini_options]
testpaths = ["tests"]
