# This repository runs its own gate. Private owner values never belong here.
[exposure]
betterleaks_config = ".gitleaks.toml"

# Synthetic fixtures contain the material the structural rules detect. This is
# not adoption debt and does not turn off the independent secret scanner.
exclude = ["tests/*"]

# One entry per published release, generated from the commits of its range, so every
# bullet carries the commit it describes. A version that was never tagged has nothing a
# compare link could resolve to, so its commits sit in the release that shipped them.
# 0.6.0 is the first release and has no predecessor tag.
[changelog]
profile = "conventional-changelog"
first_version = "0.6.0"

[changelog.generator]
engine = "git-cliff"

# Build and qualify locally; GitHub is an explicit delivery adapter. This names
# the tool's own publisher, never a project it guards. No hosted runner is needed.
[release]
repository = "Muratovnik/release-kit"
publisher = "github"
build = [["{python}", "tools/build_release.py", "{assets}"]]
branch = "main"
version_file = "src/releasekit/__init__.py"
version_pattern = '^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$'
assets = [
    "relkit.pyz",
    "relkit.pyz.sha256",
    "release-kit-plugin.zip",
    "release-kit-plugin.zip.sha256",
    "release_kit-{version}-py3-none-any.whl",
    "release_kit-{version}-py3-none-any.whl.sha256",
    "release.json",
]
# Source checks do not qualify a throwaway build as the release candidate.
checks = [["{python}", "tools/check_distribution.py", "--source-only"]]
# Runs from the committed Git-free snapshot against these exact candidate files.
smoke = [["{python}", "tools/check_distribution.py", "--assets", "{assets}", "--version", "{version}", "--work-dir", "{temp}"]]
smoke_platforms = ["linux", "darwin", "win32"]
# The combined source command includes separate bounded base and MCP suites.
command_timeout = 7200
require_provenance = false
